<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sakina</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="32" height="32">
    <div>
      <h1>Sakina</h1>
      <p>Calmer YouTube</p>
    </div>
  </header>

  <section class="card" id="music-card">
    <label class="row">
      <span class="title">Remove music</span>
      <input type="checkbox" id="musicOn" role="switch">
    </label>
    <div class="segmented two" role="radiogroup" aria-label="Method">
      <label><input type="radio" name="mode" value="ai"><span>AI, ahead of time</span></label>
      <label><input type="radio" name="mode" value="live"><span>Live, lighter</span></label>
    </div>
    <p class="status" id="musicStatus">…</p>
    <p class="status" id="aiStatus" hidden></p>
    <div class="meter" aria-hidden="true"><div id="musicMeter"></div></div>
    <label class="slider">
      <span>Strength <em id="strengthVal"></em></span>
      <input type="range" id="strength" min="0.2" max="1" step="0.05">
    </label>
    <label class="slider">
      <span>Protect voices &amp; recitation <em id="voiceProtectVal"></em></span>
      <input type="range" id="voiceProtect" min="0" max="1" step="0.05">
    </label>
    <label class="slider">
      <span>Voice focus (stereo) <em id="voiceFocusVal"></em></span>
      <input type="range" id="voiceFocus" min="0" max="1" step="0.05">
    </label>
    <label class="row sub">
      <span>Keep sound effects<small id="keepSfxHint"></small></span>
      <input type="checkbox" id="keepSfx" role="switch">
    </label>
  </section>

  <section class="card" id="blur-card">
    <label class="row">
      <span class="title">Blur 18+ scenes</span>
      <input type="checkbox" id="blurOn" role="switch">
    </label>
    <p class="status" id="blurStatus">…</p>
    <div class="segmented" role="radiogroup" aria-label="Sensitivity">
      <label><input type="radio" name="sensitivity" value="strict"><span>Strict</span></label>
      <label><input type="radio" name="sensitivity" value="balanced"><span>Balanced</span></label>
      <label><input type="radio" name="sensitivity" value="relaxed"><span>Relaxed</span></label>
    </div>
  </section>

  <footer>Works on youtube.com. Some music and scenes can still slip through.</footer>
  <script src="dist/popup.js"></script>
</body>
</html>
