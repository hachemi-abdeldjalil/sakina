<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sakina</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <label class="lead">
      <span>Remove music</span>
      <input type="checkbox" id="musicOn" role="switch" class="switch big">
    </label>
    <p class="status" id="status" aria-live="polite"></p>

    <label class="row" id="sfxRow">
      <span>
        <span class="row-label">Keep sound effects</span>
        <span class="hint" id="keepSfxHint"></span>
      </span>
      <input type="checkbox" id="keepSfx" role="switch" class="switch">
    </label>

    <details id="more">
      <summary>More settings</summary>

      <fieldset class="choice">
        <legend>Quality</legend>
        <label><input type="radio" name="mode" value="ai"><span>Best</span></label>
        <label><input type="radio" name="mode" value="live"><span>Light</span></label>
      </fieldset>
      <p class="hint" id="modeHint"></p>

      <label class="slider">
        <span>Protect voices and recitation</span>
        <input type="range" id="voiceProtect" min="0" max="1" step="0.05">
      </label>
      <label class="slider" id="strengthRow">
        <span>Strength</span>
        <input type="range" id="strength" min="0.2" max="1" step="0.05">
      </label>
      <label class="slider">
        <span>Centre focus</span>
        <span class="hint">Turns down sound panned to the left and right.</span>
        <input type="range" id="voiceFocus" min="0" max="1" step="0.05">
      </label>
    </details>
  </main>

  <footer>Everything stays on your computer.</footer>
  <script src="dist/popup.js"></script>
</body>
</html>
